# An Unluminous plugin. See the Rust one for what the format is.

plugin.id          = json
plugin.name        = JSON
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax colouring, a file icon and the Dracula colour scheme for JSON. Strings, numbers, punctuation and the three literal values true, false and null are told apart.
plugin.limitations = JSON has no comments, so none are read: a `//` or `/* */` written into a JSON file is not valid JSON either, and colouring it as a comment would be colouring a mistake as though it were accepted. A number with a signed exponent such as `1e+10` is read as two tokens rather than one, because the number rule stops at the first character that is not a letter, a digit or an underscore and `+` is none of those - `1e` is drawn as a number, `+` falls through uncoloured, and `10` is a second number. A key and a string value are coloured identically, which is correct rather than a limitation: JSON has exactly one string type and a key is one.

language.extensions    = .json
language.strings       = "
language.escapes       = true
language.numbers       = true
language.operators     = {}[]:,-

# JSON's only three reserved words, and none of them is a keyword in the sense a language with
# control flow has one - they are the values a string, a number and an object or array are not, so
# they read the same way a JavaScript literal such as `undefined` does: as a builtin rather than a
# keyword, because nothing about them controls the shape of the file the way `if` or `for` does.
language.builtins = true, false, null

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
