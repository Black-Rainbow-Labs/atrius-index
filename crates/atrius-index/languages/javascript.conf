# An Unluminous plugin. Plain `name = value`, the same format the settings file uses, and safe to edit by
# hand: Unluminous reads a plugin folder from %APPDATA%\Unluminous\plugins in preference to the copy bundled
# inside the program, so correcting this file is how a keyword gets added.

plugin.id          = javascript
plugin.name        = JavaScript
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax colouring, a file icon and the Dracula colour scheme for JavaScript. Keywords, builtins, strings including template literals, numbers, line and block comments, function calls and types are told apart.
plugin.limitations = A regular expression literal is coloured as division, because the two cannot be told apart without parsing. Interpolation inside a template literal is coloured as part of the string. JSX is coloured as plain text. A class method is found as a definition only when its parameter list opens and closes on one line, so one whose parameters span lines is missed rather than half found.

language.extensions    = .js, .mjs, .cjs, .jsx
language.line_comment  = //
language.block_comment = /*, */
language.strings       = ", ', `
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>!&|^~?:;,.

language.keywords = const, let, var, function, class, extends, new, return, if, else, for, while, do, switch, case, default, break, continue, try, catch, finally, throw, typeof, instanceof, in, of, delete, void, async, await, yield, import, export, from, as, static, get, set, this, super, null, undefined, true, false, debugger, with

# Which keyword makes the word after it a definition, and of what, plus the one heuristic:
# `brace_definitions` finds a class method, which in JavaScript has no keyword in front of its name.
# What that finds is marked as a guess and stays marked, which is what the second-class row in the
# references modal is.
language.definers        = function=function, class=type, const=variable, let=variable, var=variable
language.brace_definitions = true

# How an import is written. See the TypeScript plugin for what each key means; JavaScript's answer is
# the same one with its own extensions.
language.imports               = quoted
language.import_keywords       = import, export, require
language.import_extensions     = .js, .jsx, .mjs, .cjs
language.import_index          = index
language.import_omit_extension = true
language.export_keyword        = export

# How a file of this language is run, and how its projects announce themselves. Both are data:
# nothing in a plugin is executed, and the code behind `npm` — which reads the `scripts` in a
# `package.json` — shipped with Unluminous. `{file}` is the path of the file that is open.
run.file    = node {file}
run.project = npm

# Which debugger a file of this language is debugged with: Microsoft's js-debug, which is the actual
# debugger inside VS Code for Node and which publishes a standalone DAP server. Data, like the two
# keys above - the name is checked against the list built into Unluminous and nothing here is executed.
debug.adapter = node

language.builtins = console, window, document, globalThis, process, module, require, Promise, Array, Object, String, Number, Boolean, Symbol, BigInt, Math, JSON, Date, RegExp, Map, Set, WeakMap, WeakSet, Error, TypeError, Infinity, NaN, setTimeout, setInterval, fetch

# Dracula. The background is deliberately not set: a colour scheme in Unluminous colours the tokens and
# not the editing area, because the window letting the desktop show through is the whole character
# of the product and an opaque scheme would take that away.
theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
