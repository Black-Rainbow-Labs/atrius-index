# An Unluminous plugin. See the Rust one for what the format is.

plugin.id          = toml
plugin.name        = TOML
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax colouring, a file icon and the Dracula colour scheme for TOML. Comments, strings, numbers, booleans and section headers such as [package] and [[bin]] are told apart.
plugin.limitations = A date or a timestamp, such as `1979-05-27T07:32:00Z`, is not read as one thing: the number rule treats a letter directly after a digit as the number's own suffix, which is right for `142u32` in Rust and wrong for a date, so `27T07` is swept into a single number token and the hyphens and colons around it fall through as plain punctuation rather than being part of a recognised date. This was checked against `syntax.rs` rather than guessed - there is no manifest key that changes what a number is allowed to contain, so a date cannot be told apart from a suffixed number here. A section header such as `[server.production]` is coloured by its brackets and its dot and nothing else: there is no token for a table header, so the words that name it are the same colour as an ordinary key, and one that starts with a capital letter reads as a type by the same heuristic every language here shares. A triple quoted string that spans more than one line (`"""…"""`, `'''…'''`) has the same fault Python's manifest names for the same reason: the string rule ends at the first line break except for a backtick, which is not something a manifest can ask for a second one of, so such a literal is read as a run of short fragments split in the wrong places rather than as one string. A basic or literal string written on one line is unaffected.

language.extensions    = .toml
# See the Python plugin for why this is not written as a bare `#`: the settings parser reads a `#`
# that ends a manifest line as the start of a comment on that line, which would silently leave this
# key empty rather than holding the character TOML actually comments with. The doubled hash below
# is a real trailing comment on this line; the value this key is set to is one character, `#`.
language.line_comment  = #
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = ={}[],.+-:

# TOML's only two reserved words. There is no `null` - an absent key is simply not written, rather
# than written and set to nothing - so, unlike JSON's three, this list has two.
language.builtins = true, false

# There is deliberately no `language.definers`: a key in a table is not a thing another file can
# reference and Go to Definition would have nowhere honest to jump to, which is the same reasoning
# CSS gives for naming none - a custom property is defined by position, not by a keyword, and here a
# key is defined by being written at all.

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
