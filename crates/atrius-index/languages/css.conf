# An Unluminous plugin. See the JavaScript one for what the format is.
#
# CSS needed three things no earlier manifest had asked for, and `tasks/task-1671-css-plugin-tdd.md`
# records why each: a hyphen has to be a letter, or no property can be named; a third list of words,
# because a stylesheet has at-rules, properties and values and two lists could only tell apart two of
# them; and `#ff0000` has to be a number, or half the colours in a file are coloured and half are not.

plugin.id          = css
plugin.name        = CSS
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax colouring, a file icon and the Dracula colour scheme for CSS. At-rules, element selectors, pseudo-classes and pseudo-elements, property names, value keywords, functions such as var and calc, hex colours, lengths with their units, strings and comments are all told apart.
plugin.limitations = A word that is both a property and a value is drawn the same way wherever it appears, because telling the two apart needs to know which side of the colon it is on and this reads one token at a time. Whichever reading is commoner wins: inset, left, top, right, bottom, content and border are properties, so border-style: inset is drawn as a property; flex, grid and all are values, because display: flex and transition: all are written far more often than the shorthand properties of the same name. A class or id name is plain text, because it is a name its author chose rather than one the language provides; the dot or hash in front of it is drawn as an operator. A custom property such as --brand-hue is plain text for the same reason. A hash and three, four, six or eight hexadecimal digits is a colour, so an id selector that happens to spell one - #dad, #face - is drawn as a colour. A negative length such as -8px is one word and is drawn in the plain text colour rather than as a number, because the hyphen belongs to the words either side of it far more often than it is a sign. SCSS, Sass and Less are deliberately not claimed: they take // as a line comment and CSS does not, and a grammar has one line comment.

language.extensions     = .css
language.block_comment  = /*, */
language.strings        = ", '
language.escapes        = true
language.numbers        = true
# No line comment. `//` is not CSS, and taking it as one would colour half of every url(https://...)
# as a comment.
#
# A hyphen and an at sign are letters here, so `background-color`, `--brand-hue`, `-webkit-mask` and
# `@font-face` are each one word. Neither is in the operators below, because a word is read before an
# operator is and they would never be reached.
language.word_characters = -, @
language.hex_colors      = true

# `@import 'theme.css'` — one keyword, one extension, and the extension is written out rather than
# dropped, because a stylesheet names the file it is importing. CSS has no definers and so no named
# import list; what completion offers here is the project's stylesheets.
language.imports               = quoted
language.import_keywords       = @import
language.import_extensions     = .css
language.import_omit_extension = false
language.operators       = {}();:,>+~*=/!%[]|^&.#

# The at-rules, the words that structure one, the element selectors, and the pseudo-classes and
# pseudo-elements. What they have in common is that they say where a rule applies rather than what it
# does, which is what a person scans a stylesheet for first.
language.keywords = @charset, @import, @namespace, @layer, @media, @supports, @container, @font-face, @font-feature-values, @counter-style, @keyframes, @-webkit-keyframes, @page, @property, @scope, @starting-style, @position-try, @view-transition, @swash, @ornaments, @annotation, @stylistic, @styleset, @character-variant, and, or, not, only, from, to, important, html, body, div, span, p, a, h1, h2, h3, h4, h5, h6, ul, ol, li, dl, dt, dd, table, thead, tbody, tfoot, tr, td, th, caption, colgroup, col, form, input, button, textarea, label, fieldset, legend, select, option, optgroup, img, picture, figure, figcaption, svg, header, footer, nav, main, section, article, aside, video, audio, canvas, iframe, code, blockquote, hr, br, strong, em, b, i, u, s, q, abbr, cite, kbd, samp, details, summary, dialog, template, slot, ins, del, mark, time, address, hgroup, menu, meter, ruby, wbr, noscript, script, style, head, title, meta, link, base, hover, focus, focus-visible, focus-within, active, visited, any-link, target, target-within, root, empty, checked, disabled, enabled, indeterminate, required, optional, valid, invalid, in-range, out-of-range, read-only, read-write, placeholder-shown, autofill, user-valid, user-invalid, first-child, last-child, only-child, first-of-type, last-of-type, only-of-type, nth-child, nth-last-child, nth-of-type, nth-last-of-type, nth-col, nth-last-col, is, where, has, dir, lang, host, host-context, defined, fullscreen, modal, popover-open, picture-in-picture, open, details-content, before, after, first-line, first-letter, selection, backdrop, marker, placeholder, file-selector-button, cue, cue-region, part, slotted, spelling-error, grammar-error, target-text, highlight, view-transition-group, view-transition-image-pair, view-transition-old, view-transition-new

