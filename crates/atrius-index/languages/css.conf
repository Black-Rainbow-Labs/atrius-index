language.types = flex, grid, all, absolute, relative, fixed, sticky, static, block, inline, inline-block, inline-flex, inline-grid, flow-root, list-item, table-cell, table-row, table-column, table-caption, none, contents, auto, hidden, visible, scroll, clip, collapse, solid, dashed, dotted, double, groove, ridge, outset, bold, bolder, lighter, normal, italic, oblique, small-caps, uppercase, lowercase, capitalize, underline, overline, line-through, center, start, end, justify, space-between, space-around, space-evenly, stretch, baseline, first, last, safe, unsafe, middle, text-top, text-bottom, sub, super, wrap, nowrap, wrap-reverse, row, row-reverse, column, column-reverse, pre, pre-wrap, pre-line, break-word, break-all, keep-all, ellipsis, inherit, initial, unset, revert, revert-layer, currentColor, transparent, cover, border-box, content-box, padding-box, no-repeat, repeat-x, repeat-y, both, forwards, backwards, infinite, alternate, alternate-reverse, running, paused, linear, ease, ease-in, ease-out, ease-in-out, step-start, step-end, pointer, default, crosshair, move, grab, grabbing, not-allowed, wait, help, progress, zoom-in, zoom-out, col-resize, row-resize, ns-resize, ew-resize, nesw-resize, nwse-resize, portrait, landscape, print, screen, speech, dark, light, serif, sans-serif, monospace, cursive, fantasy, system-ui, ui-monospace, ui-serif, ui-sans-serif, min-content, max-content, fit-content, thin, medium, thick, small, large, larger, smaller, x-small, xx-small, x-large, xx-large, ltr, rtl, horizontal, vertical, horizontal-tb, vertical-rl, vertical-lr, manual, isolate, disc, circle, square, decimal, lower-alpha, upper-alpha, lower-roman, upper-roman, outside, inside, separate, always, avoid, recto, verso, crisp-edges, pixelated, multiply, overlay, darken, lighten, difference, exclusion, hue, saturation, luminosity, allow-end, force-end, balance, each-line, hanging, blink, wavy, under, over, srgb, display-p3, currentcolor, anywhere

# Dracula, which is what the other bundled plugins use, so a folder of mixed files is coloured with
# one scheme rather than four. It is Unluminous's per-token mapping rather than Dracula's CSS-specific one:
# `theme.builtin` is purple in every other manifest here, and a stylesheet in the tab beside a
# TypeScript file should be read in the same scheme rather than a second one that almost agrees.
theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
