# SQL: an ordinary language plugin, and the one the Database plugin's console is coloured through.
#
# A `.sql` file in a project is coloured whether or not anybody opens the database pane, which is why
# this is a plugin of its own rather than a word list inside the Database one. `Look::highlighter` is
# the seam: `unluminous-core` holds no plugin registry, so the console asks through `CodeHighlighter` and
# the window answers with the same two calls `colour_the_file` makes for a source file. The console
# and a `.sql` file therefore agree by construction rather than by two lists kept in step.

plugin.id          = sql
plugin.name        = SQL
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax colouring and a file icon for SQL. The keywords, the two kinds of comment, string literals and quoted identifiers, the built-in functions and the type names are all told apart, in a `.sql` file and in the Database plugin's query console, from this one list.
plugin.limitations = One SQL rather than a dialect per engine. The keyword list is the common core plus what PostgreSQL and SQLite add, so a word another engine reserves and these two do not is coloured as an identifier. A word that is both a keyword and a function name is coloured whichever way it is written more often, which is the rule the CSS plugin already settled. A dollar-quoted function body is coloured as ordinary SQL rather than as the language inside it: that is `language.raw_text`'s job and a `$$ ... $$` body names no language. Nothing here decides where one statement ends and the next begins - the console asks `unluminous_db::sql`, which knows about the four things a semicolon can hide inside.

language.extensions = .sql, .ddl, .dml, .psql

# `--` to the end of the line, and `/* ... */`, which both engines take. PostgreSQL's block comments
# nest, which nothing here has to know: a nested one is still coloured as a comment throughout.
language.line_comment  = --
language.block_comment = /*, */

# A single quote is a string literal and a double quote is a quoted identifier. Both are listed,
# because what matters to the colouring is that a keyword or a semicolon inside either is not read as
# code; which of the two it is matters only to the statement splitter, which is not this file.
language.strings = ', "
# **Escapes are off**, and that is the one thing about SQL a grammar written from habit gets wrong.
# `standard_conforming_strings` has been on by default since PostgreSQL 9.1, so a backslash inside a
# literal is an ordinary character - and a reader that treated it as an escape would end the literal
# in the wrong place for every Windows path anybody ever selected. A quote is escaped by doubling it,
# which the tokeniser's own rule for a repeated delimiter already covers.
language.escapes = false
language.numbers = true

# No `language.word_characters`: a hyphen is not part of a word here, because `a-b` is a subtraction.
# No `language.hex_colors`: `#ff0000` is not a thing in SQL.
language.operators = +-*/%=<>!&|^~?:;,.()[]{}

language.keywords = select, from, where, group, by, having, order, limit, offset, fetch, first, next, rows, only, insert, into, values, update, set, delete, truncate, merge, using, returning, with, recursive, as, distinct, all, union, intersect, except, join, inner, left, right, full, outer, cross, lateral, natural, on, and, or, not, in, exists, between, like, ilike, similar, is, null, true, false, unknown, case, when, then, else, end, create, alter, drop, table, view, materialized, index, unique, sequence, schema, database, extension, trigger, function, procedure, returns, language, begin, commit, rollback, savepoint, transaction, start, work, primary, key, foreign, references, constraint, check, default, cascade, restrict, add, column, rename, to, if, replace, temporary, temp, unlogged, grant, revoke, role, user, password, owner, analyze, explain, vacuum, pragma, attach, detach, conflict, do, nothing, over, partition, window, filter, within, asc, desc, nulls, last, collate, cast, array, row, desc, exists, some, any

language.builtins = count, sum, avg, min, max, coalesce, nullif, greatest, least, now, current_date, current_time, current_timestamp, current_user, session_user, extract, date_trunc, date_part, age, to_char, to_date, to_timestamp, to_number, substring, substr, trim, ltrim, rtrim, upper, lower, initcap, length, char_length, octet_length, position, overlay, replace, split_part, concat, concat_ws, format, lpad, rpad, repeat, reverse, md5, random, abs, ceil, ceiling, floor, round, trunc, sign, mod, power, sqrt, exp, ln, log, generate_series, unnest, array_agg, string_agg, json_agg, jsonb_agg, to_json, to_jsonb, json_build_object, jsonb_build_object, row_number, rank, dense_rank, ntile, lag, lead, first_value, last_value, nth_value, ifnull, iif, group_concat, json_extract, printf, typeof, nextval, currval, setval, pg_typeof, version

# The third list `task-1671` added for CSS, used here for the type names. They are neither keywords nor
# functions, and colouring them as identifiers made a `CREATE TABLE` read as a list of column names
# with nothing to tell the two halves apart.
language.types = int, int2, int4, int8, integer, bigint, smallint, serial, bigserial, smallserial, decimal, numeric, real, double, precision, float, float4, float8, money, char, character, varchar, text, bytea, blob, clob, boolean, bool, date, time, timestamp, timestamptz, timetz, interval, uuid, json, jsonb, xml, point, line, lseg, box, path, polygon, circle, cidr, inet, macaddr, tsvector, tsquery, enum, oid, name, regclass, void, record, anyelement, anyarray

# The colour scheme, which is the Dracula one every bundled language plugin ships. A scheme colours the
# **tokens** and not the editing area: Dracula's own `#282A36` background is deliberately unused,
# because the window letting the desktop show through is the whole character of the product and a
# scheme that repainted it would trade that away to be a shade nearer a screenshot.
theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
