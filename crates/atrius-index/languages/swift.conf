# An atrius-index language manifest, in the format `docs/languages.md` describes.

plugin.id          = swift
plugin.name        = Swift
plugin.kind        = language
plugin.limitations = An extension names a type defined elsewhere, so it is not a definition. A multi line string is read as text.

language.extensions    = .swift
language.line_comment  = //
language.block_comment = /*, */
language.strings       = "
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>!&|^~?:;,.@

language.keywords = associatedtype, class, deinit, enum, extension, fileprivate, func, import, init, inout, internal, let, open, operator, private, precedencegroup, protocol, public, rethrows, static, struct, subscript, typealias, var, break, case, catch, continue, default, defer, do, else, fallthrough, for, guard, if, in, repeat, return, throw, switch, where, while, as, false, is, nil, self, Self, super, throws, true, try, async, await, actor, some, any
language.builtins = String, Int, Double, Bool, Array, Dictionary, Set, Optional, print

language.definers = func=function, class=type, struct=type, enum=type, protocol=type, actor=type, typealias=type, let=constant, var=variable
