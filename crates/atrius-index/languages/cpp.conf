# An atrius-index language manifest, in the format `docs/languages.md` describes.

plugin.id          = cpp
plugin.name        = C++
plugin.kind        = language
plugin.limitations = A function is found when its parameter list opens and closes on one line, followed by its opening brace on that line or the next, with qualifiers such as const or override between. A template's angle brackets are read as operators. A macro is not a definition.

language.extensions    = .cpp, .cc, .cxx, .c++, .hpp, .hh, .hxx, .h++, .ipp, .inl, .tpp
language.line_comment  = //
language.block_comment = /*, */
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>!&|^~?:;,.

language.keywords = alignas, alignof, auto, bool, break, case, catch, char, char8_t, char16_t, char32_t, class, concept, const, consteval, constexpr, constinit, const_cast, continue, co_await, co_return, co_yield, decltype, default, delete, do, double, dynamic_cast, else, enum, explicit, export, extern, false, final, float, for, friend, goto, if, inline, int, long, mutable, namespace, new, noexcept, nullptr, operator, override, private, protected, public, register, reinterpret_cast, requires, return, short, signed, sizeof, static, static_assert, static_cast, struct, switch, template, this, thread_local, throw, true, try, typedef, typeid, typename, union, unsigned, using, virtual, void, volatile, wchar_t, while, defined
language.builtins = std, string, vector, map, unordered_map, set, unique_ptr, shared_ptr, size_t, nullptr_t, cout, cerr, endl, move, forward, make_unique, make_shared

language.definers          = class=type, struct=type, enum=type, union=type, namespace=module, concept=type
language.brace_definitions = true
language.brace_next_line   = true
language.definition_tail   = true
