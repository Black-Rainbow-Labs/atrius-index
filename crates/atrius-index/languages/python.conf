# An Unluminous plugin. See the Rust one for what the format is.
#
# Triple quoted strings are Python's docstrings and its only string that spans more than one line,
# and `syntax.rs` was read before this was written to find out whether they could be coloured
# properly. They cannot: a string in Unluminous's tokeniser is one quote character long and ends at
# the first line break, and the one exemption from that - a backtick may run on - is written into
# the tokeniser by name rather than offered as a manifest key, so nothing here can ask for a second
# one. `"""` is read as an empty string (the first two quotes closing each other), then a second
# string opening on the third quote and running to the end of that line, then the body of the
# docstring is read as ordinary words with no string colour at all until the closing `"""` repeats
# the same pattern. Listing `"` and `'` below is still right, because it colours the far more common
# string that stays on one line correctly; the docstring case is a real, visible gap and is named in
# `plugin.limitations` rather than pretended away.

plugin.id          = python
plugin.name        = Python
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax colouring, a file icon and the Dracula colour scheme for Python. Keywords, builtins, single and double quoted strings, numbers with underscores and hexadecimal, comments, function and class definitions, and imports are told apart.
plugin.limitations = A triple quoted string spans lines and this tokeniser's string rule does not, except for a backtick, which the tokeniser exempts by name rather than through a manifest key, so nothing here can ask for a second one: `"""` opens and closes an empty string on itself, a second string then runs to the end of that line, and the rest of a docstring that spans more than one line is read as ordinary words rather than as one string. A short docstring written on one line, such as `"""One line."""`, is unaffected, because it never crosses a line break. A string prefix such as `r`, `b`, `f` or `rb` is drawn as plain text in front of the string, and interpolation inside a string with an `f` prefix is coloured as part of the string, exactly as a JavaScript template literal's interpolation is. `self` and `cls` are drawn as builtins even though the language does not reserve either word, because they name a real thing in almost every method written and a plain identifier colour would lose that. A relative import's leading dots (`from . import x`, `from ..pkg import y`) are not resolved to a folder, because `language.path_roots` names words and a dot is punctuation.

language.extensions    = .py, .pyw
# A bare `#` cannot be written as this value on its own: `services::store::Values::parse` treats a
# `#` that ends a line as the start of a comment on the *manifest* line itself, which would leave
# this key with an empty string rather than the character Python actually comments with - and an
# empty `line_comment` is worse than none, because `rest.starts_with("")` is true everywhere, so
# every position in every file would read as a comment. The second `#` below is a real trailing
# comment on this line, which is what keeps the first one from being read as ending it; the value
# `language.line_comment` is set to is one character, `#`, exactly as every other plugin's is.
language.line_comment  = #
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>!&|^~?:;,.@

language.keywords = False, None, True, and, as, assert, async, await, break, class, continue, def, del, elif, else, except, finally, for, from, global, if, import, in, is, lambda, nonlocal, not, or, pass, raise, return, try, while, with, yield

# `self` and `cls` are not reserved words - they are ordinary parameter names a person could call
# anything - but every method in practice calls the first one `self` and a classmethod's first one
# `cls`, and a plain identifier colour for the word that names "this object" throughout a whole class
# body loses something every other bundled plugin keeps: JavaScript colours `this` and `super` as
# keywords for the same reason, and Python's convention is strong enough to read the same way here.
language.builtins = self, cls, print, len, range, enumerate, zip, map, filter, sorted, reversed, sum, min, max, abs, round, int, float, str, bool, list, dict, set, tuple, frozenset, bytes, bytearray, type, isinstance, issubclass, super, object, Exception, ValueError, TypeError, KeyError, IndexError, AttributeError, StopIteration, RuntimeError, NotImplementedError, FileNotFoundError, ImportError, open, input, iter, next, getattr, setattr, hasattr, delattr, vars, dir, id, hash, repr, format, staticmethod, classmethod, property

# Which keyword makes the word after it a definition, and of what. `def` and `class` are both
# reserved words with no other reading, so there is no heuristic to add on top of them the way
# JavaScript needs `brace_definitions` for a method with no keyword in front of it - a Python method
# is still written after `def`.
language.definers = def=function, class=type

# `import a.b.c` and `from a.b import c` are both the `path` family: a module is a dotted name
# resolved against the package tree rather than a quoted string resolved against the file system,
# which is Rust's own shape with `.` for `::`. `__init__.py` is what makes a folder a package, which
# is `mod.rs`/`lib.rs`/`main.rs`'s role in Rust. There is deliberately no `source_roots`: Rust's `src`
# is one folder every Cargo package agrees on, and Python has no single equivalent - a `src` layout,
# a flat layout and a `package/` layout are all common, and naming one would be wrong for the other
# two. There is deliberately no `export_keyword` either: nothing in Python hides a name declared at
# module scope from an importer, so leaving it unset is what `unluminous_core::symbols` reads as "nothing is hidden",
# which is exactly right - every function and class at module scope is importable.
language.imports           = path
language.import_keywords   = import, from
language.import_extensions = .py
language.import_index      = __init__
language.path_separator    = .

# `debug.adapter` is deliberately unset. `plugins::DEBUGGERS` only drives lldb and node, so naming
# anything else here would be refused with a message rather than loading a Python plugin with a
# Debug button that does nothing - the rule that a control is absent when it cannot apply reaches
# the manifest that would cause it too, not only the button it would draw.

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
