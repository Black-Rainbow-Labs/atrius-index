# An atrius-index language manifest, in the format `docs/languages.md` describes.

plugin.id          = csharp
plugin.name        = C#
plugin.kind        = language
plugin.limitations = A method is found when its parameter list opens and closes on one line, followed by its opening brace on that line or the next. An expression bodied member written with => is not found. A property is not a definition.

language.extensions    = .cs, .csx
language.line_comment  = //
language.block_comment = /*, */
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>!&|^~?:;,.@

language.keywords = abstract, as, base, bool, break, byte, case, catch, char, checked, class, const, continue, decimal, default, delegate, do, double, else, enum, event, explicit, extern, false, finally, fixed, float, for, foreach, goto, if, implicit, in, int, interface, internal, is, lock, long, namespace, new, null, object, operator, out, override, params, private, protected, public, readonly, record, ref, return, sbyte, sealed, short, sizeof, stackalloc, static, string, struct, switch, this, throw, true, try, typeof, uint, ulong, unchecked, unsafe, ushort, using, virtual, void, volatile, while, var, async, await, get, set, init, where, yield, nameof, when
language.builtins = Console, String, List, Dictionary, Task, Exception, Math, DateTime, Guid, IEnumerable

language.definers          = class=type, struct=type, interface=type, enum=type, record=type, namespace=module
language.brace_definitions = true
language.brace_next_line   = true
language.definition_tail   = true
