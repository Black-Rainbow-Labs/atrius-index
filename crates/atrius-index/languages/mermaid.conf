plugin.id = mermaid
plugin.name = Mermaid
plugin.version = 1.0.0
plugin.vendor = Unluminous
plugin.kind = language
plugin.description = Draws Mermaid diagrams. A .mmd or .mermaid file opens with the same raw, side by side and preview toggle a Markdown file has, and a ```mermaid block inside a Markdown document is drawn in its preview. Twenty diagram types are drawn: flowchart, sequence, class, state, entity relationship, requirement, pie, gantt, user journey, git graph, mindmap, timeline, quadrant, xy chart, sankey, block, packet, kanban, radar and treemap.
plugin.limitations = The pictures are Unluminous's own drawing of the diagram rather than mermaid.js output, so they are not pixel identical: curves are drawn as straight segments, the fonts are the editor's and the colours are Unluminous's. Ten diagram types are named rather than drawn - C4, ZenUML, architecture, swimlanes, event modelling, Venn, Ishikawa, Wardley, Cynefin and tree view. A diagram's own style, classDef and click directives are read and ignored: a document does not choose the window's colours, and nothing in a diagram is run. Nothing is ever fetched.

language.extensions = .mmd, .mermaid
language.renders = mermaid
language.line_comment = %%
language.strings = ", '
language.escapes = false
language.numbers = true
language.operators = -.=<>|&:{}[]()+*/

# The words that open a diagram, and the words that structure one. Both lists are what a person
# writing a .mmd file types most, so colouring them is what makes the source readable while it is
# being written rather than only once it is drawn.
language.keywords = flowchart, graph, sequenceDiagram, classDiagram, stateDiagram, stateDiagram-v2, erDiagram, journey, gantt, pie, quadrantChart, requirementDiagram, gitGraph, mindmap, timeline, sankey-beta, sankey, xychart-beta, xychart, block-beta, block, packet-beta, packet, kanban, radar-beta, radar, treemap-beta, treemap, subgraph, end, direction, class, state, namespace, section, title, participant, actor, note, loop, alt, else, opt, par, and, critical, option, break, rect, box, activate, deactivate, autonumber, link, links, commit, branch, checkout, switch, merge, cherry-pick, requirement, functionalRequirement, interfaceRequirement, performanceRequirement, physicalRequirement, designConstraint, element, columns, space, curve, axis, quadrant-1, quadrant-2, quadrant-3, quadrant-4, x-axis, y-axis, bar, line, dateFormat, axisFormat, excludes, includes, todayMarker, tickInterval, weekday, accTitle, accDescr, showData, style, classDef, click, callback, href, linkStyle, graticule, ticks, showLegend, max, min

language.builtins = TB, TD, BT, LR, RL, done, active, crit, milestone, after, until, NORMAL, REVERSE, HIGHLIGHT, choice, fork, join, abstract, interface, enumeration, service, PK, FK, UK, id, tag, type, assigned, ticket, priority, label, shape, horizontal

# Dracula, which is what the other bundled plugins use, so a folder of mixed files is coloured with
# one scheme rather than three.
theme.name = Dracula
theme.keyword = #FF79C6
theme.builtin = #8BE9FD
theme.string = #F1FA8C
theme.comment = #6272A4
theme.number = #BD93F9
theme.function = #50FA7B
theme.type = #8BE9FD
theme.operator = #FF79C6
theme.punctuation = #F8F8F2
