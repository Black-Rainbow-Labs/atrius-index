# An atrius-index language manifest, in the format `docs/languages.md` describes.

plugin.id          = kotlin
plugin.name        = Kotlin
plugin.kind        = language
plugin.limitations = An extension function written as fun Type.name is not found, because the dot ends the definition. A property declared in a constructor is not a definition.

language.extensions    = .kt, .kts
language.line_comment  = //
language.block_comment = /*, */
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>!&|^~?:;,.@

language.keywords = as, break, class, continue, do, else, false, for, fun, if, in, interface, is, null, object, package, return, super, this, throw, true, try, typealias, typeof, val, var, when, while, by, catch, constructor, delegate, dynamic, field, file, finally, get, import, init, param, property, receiver, set, setparam, where, abstract, annotation, companion, const, crossinline, data, enum, expect, external, final, infix, inline, inner, internal, lateinit, noinline, open, operator, out, override, private, protected, public, reified, sealed, suspend, tailrec, vararg, value
language.builtins = String, Int, Long, Double, Boolean, Unit, Any, List, Map, Set, listOf, mapOf, setOf, println

language.definers = fun=function, class=type, interface=type, object=type, typealias=type, val=variable, var=variable
