# An atrius-index language manifest, in the format `docs/languages.md` describes.

plugin.id          = php
plugin.name        = PHP
plugin.kind        = language
plugin.limitations = Text outside the PHP tags is read as code. A heredoc is read as text.

language.extensions    = .php, .phtml
language.line_comment  = //
language.block_comment = /*, */
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>!&|^~?:;,.@

language.keywords = abstract, and, array, as, break, callable, case, catch, class, clone, const, continue, declare, default, do, echo, else, elseif, empty, enddeclare, endfor, endforeach, endif, endswitch, endwhile, enum, extends, final, finally, fn, for, foreach, function, global, goto, if, implements, include, include_once, instanceof, insteadof, interface, isset, list, match, namespace, new, or, print, private, protected, public, readonly, require, require_once, return, static, switch, throw, trait, try, unset, use, var, while, xor, yield, true, false, null
language.builtins = self, parent, strlen, count, array_map, array_filter, json_encode, json_decode

language.definers = function=function, class=type, interface=type, trait=type, enum=type, namespace=module, const=constant
