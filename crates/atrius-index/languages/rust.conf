# An Unluminous plugin. See the JavaScript one for what the format is.

plugin.id          = rust
plugin.name        = Rust
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax colouring, a file icon and the Dracula colour scheme for Rust. Keywords, the standard library's types, lifetimes, numbers with their suffixes, doc comments and macro calls are told apart.
plugin.limitations = A block comment ends at the first terminator, so a nested one is not followed, which Rust allows and this does not. A raw string with hashes is coloured as a plain string. A lifetime is coloured as an operator and then a name. A definition is found by the keyword in front of it, so a name bound inside a pattern — `let Some(value)`, a match arm, a closure argument — is not one.

language.extensions    = .rs
language.line_comment  = //
language.block_comment = /*, */
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>!&|^?:;,.#

language.keywords = fn, let, mut, const, static, struct, enum, trait, impl, dyn, type, mod, use, pub, crate, self, Self, super, where, for, in, while, loop, if, else, match, return, break, continue, move, ref, as, async, await, unsafe, extern, box, yield, true, false

# Which keyword makes the word after it a definition, and of what. This is what `Go to Definition`,
# `Find References` and `Rename Symbol` read. `impl` is deliberately not here: it opens a block and
# declares no name of its own. `use` is not here either, because it names something defined
# somewhere else.
language.definers = fn=function, struct=type, enum=type, trait=type, mod=module, const=constant, static=constant, type=type, let=variable

# How an import is written. Rust is the `path` family: the module is a path of segments rather than a
# string, so it is resolved against a module tree instead of against the file system.
# `source_roots` is the folder a package's tree is rooted in, which is why `unluminous_core::completion`
# reaches `crates/unluminous-core/src/completion.rs` with no `src` written in the path, and `path_roots`
# names the three segments that are not module names. `pub` is what makes an item importable.
language.imports           = path
language.import_keywords   = use
language.import_extensions = .rs
language.import_index      = mod, lib, main
language.export_keyword    = pub
language.path_separator    = ::
language.source_roots      = src
language.path_roots        = crate=package, self=module, super=parent

# How a Rust project announces itself. There is deliberately no `run.file`: running one file of a
# Cargo project is not a thing cargo does, so `Run Current File` is **absent** for a `.rs` file
# rather than offered and wrong.
run.project = cargo

# Which debugger a `.rs` file is debugged with. Data, like the two keys above: the name is checked
# against the list built into Unluminous, and the code that finds `lldb-dap` or `codelldb` on this machine
# and drives it shipped with the binary. With the MSVC toolchain rustup installs by default on
# Windows, LLDB reads PDB debug information incompletely - breakpoints and stepping work, and some
# enums and collections render poorly. The GNU toolchain's DWARF is fully readable.
debug.adapter = lldb

language.builtins = String, Vec, Option, Result, Some, None, Ok, Err, Box, Rc, Arc, RefCell, Cell, Mutex, RwLock, HashMap, HashSet, BTreeMap, BTreeSet, VecDeque, Path, PathBuf, Iterator, IntoIterator, Default, Clone, Copy, Debug, Display, Drop, From, Into, TryFrom, TryInto, Send, Sync, Sized, Fn, FnMut, FnOnce, println, print, eprintln, format, vec, panic, assert, assert_eq, matches, write, writeln, todo, unimplemented, unreachable, u8, u16, u32, u64, u128, usize, i8, i16, i32, i64, i128, isize, f32, f64, bool, char, str

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
