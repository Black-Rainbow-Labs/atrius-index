# An Unluminous plugin. See the CSS one for what the format is.
#
# HTML is the first plugin that asks for `language.markup`, and `tasks/task-1694-html-plugin-tdd.md`
# records why the key exists at all: a paragraph of English is not a run of words the language
# provides, so a grammar that read a word list over every byte would colour the prose, and the fix
# is a rule rather than a list. With the key on, the tokeniser runs five states — text, tag name,
# attribute, value and raw text — and a `<` opens a tag only when a letter, `/`, `!` or `?` follows
# it, which is the HTML Standard's own tag-open state and the reason `5 < 3` stays prose.

plugin.id          = html
plugin.name        = HTML
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax colouring, a file icon and the Dracula colour scheme for HTML. Element names, custom elements, attribute names, attribute values, character references and comments are all told apart, and the body of a style or script block is coloured by the plugin that claims its language.
plugin.limitations = An element name the language does not name is drawn as a type rather than plain text, because its position is certain - it is the first word of a tag - and only whether the language defines it is unknown, so a custom element such as a web component is drawn in a colour that says it is a tag. An attribute name that is not in the list is plain text, for the reason a class selector is in the CSS plugin: there is one tag name in a tag and there may be a dozen attributes, and the ones that are not named are names their author chose. Uppercase element names are drawn as custom elements, because a case-insensitive match would need a second lookup path in a function that runs over every byte of every file. A style attribute holds CSS and an on* attribute holds JavaScript, and both are drawn as strings: embedding a language inside a string is a different mechanism from embedding one inside an element and buys much less. The body of a script or style block is one level deep only, so a manifest that embedded markup inside markup gets one level and no recursion. XML, SVG, Vue, Svelte, Astro and JSX are deliberately not claimed: they are markup or templates with a template in them, not HTML, and calling their files HTML in the status bar would be a lie.

language.extensions     = .html, .htm
language.block_comment  = <!--, -->
language.strings        = ", '
language.escapes        = true
language.numbers        = false
# No hex colours: a hash in HTML is href="#anchor" and prose, and a number in HTML is nearly always
# in prose, so neither is read. The one place a digit run means something is inside a numeric
# character reference, and that is read by the entity rule rather than by the number rule.
language.hex_colors      = false
# A hyphen is a letter, so aria-label, data-track-id, http-equiv and accept-charset are each one
# word. A colon is deliberately not one, so xml:lang is two words with the colon between them: it
# would join words across prose and it would change what Rename Symbol thinks a word is.
language.word_characters = -

# `src="page.html"` and `href="style.css"` complete the project's own files, which falls out of
# task-1680 with no new code: the caret is inside a string and an import keyword appears as a whole
# word between the start of the statement and that string. What is inserted is a relative path with
# its extension written out, because HTML names the file it is pointing at exactly as an @import in
# a stylesheet does. HTML declares nothing, so export_keyword is not named and nothing is hidden.
language.imports               = quoted
language.import_keywords       = src, href, srcset, data, poster, action, formaction
language.import_extensions     = .html, .htm, .css, .js, .mjs, .cjs, .png, .jpg, .jpeg, .gif, .svg, .webp, .ico, .mp4, .webm, .mp3, .wav, .ogg, .woff, .woff2, .ttf, .otf, .eot, .json, .txt, .xml, .pdf
language.import_omit_extension = false

# The five states. With this on, a `<` opens a tag only when a letter, `/`, `!` or `?` follows it,
# the first word of a tag is read as a tag name, the rest as attributes, a quoted or unquoted value
# after an equals sign is a string, and the body of a raw text element swallows its own contents.
language.markup = true
# The HTML Standard's own two categories: script and style are raw text elements, and textarea and
# title are escapable raw text elements, the difference being that character references are still
# decoded in the second pair. An entry that names a language is raw text and one that names none is
# escapable, so &amp; inside a title is still coloured and &amp; inside a script is not. The
# language name is resolved by the plugin that claims it, the same way a fence in a Markdown
# document is, and a language nothing claims answers with nothing.
language.raw_text = script=javascript, style=css, textarea, title

language.operators = <>=/!

# The element names, MDN's element reference, the deprecated ones included, because a plugin's job
# is to read the HTML that exists rather than the HTML that should be. DOCTYPE and doctype are in
# the list so the declaration colours, and the html after it is an element name and colours too.
language.keywords = html, head, title, base, link, meta, style, body, section, nav, article, aside, h1, h2, h3, h4, h5, h6, header, footer, address, main, p, hr, pre, blockquote, ol, ul, li, dl, dt, dd, figure, figcaption, div, a, em, strong, small, s, cite, q, dfn, abbr, ruby, rt, rp, data, time, code, var, samp, kbd, sub, sup, i, b, u, mark, bdi, bdo, span, br, wbr, ins, del, img, iframe, embed, object, param, video, audio, source, track, map, area, picture, canvas, svg, math, table, caption, colgroup, col, thead, tbody, tfoot, tr, td, th, form, label, input, button, select, datalist, optgroup, option, textarea, output, progress, meter, fieldset, legend, details, summary, dialog, template, slot, shadowroot, script, noscript, DOCTYPE, doctype, acronym, applet, basefont, big, center, dir, font, frame, frameset, noframes, strike, tt, isindex, xmp, listing, plaintext, blink, spacer, keygen, multicol, nextid

# The attribute names: MDN's global attributes, the element-specific ones a person writes, the
# aria-* names that are a fixed list, and the event handler attributes. data-* is not a name, it is
# a shape, so it is not in the list and data-track-id is plain text.
language.builtins = accept, accept-charset, accesskey, action, allow, allowfullscreen, alt, as, async, autocomplete, autofocus, autoplay, capture, challenge, charset, checked, cite, class, color, cols, colspan, content, contenteditable, contextmenu, controls, controlslist, coords, crossorigin, csp, data, datetime, decoding, default, defer, dir, dirname, disabled, download, draggable, enctype, enterkeyhint, for, form, formaction, formenctype, formmethod, formnovalidate, formtarget, headers, hidden, high, href, hreflang, http-equiv, id, importance, inert, inputmode, integrity, is, kind, label, lang, loading, loop, low, manifest, max, maxlength, media, method, min, minlength, multiple, muted, name, nomodule, nonce, open, optimal, pattern, placeholder, poster, preload, radiogroup, readonly, referrerpolicy, rel, required, reversed, rows, rowspan, sandbox, scope, scoped, selected, shape, size, sizes, slot, span, spellcheck, src, srcdoc, srclang, srcset, start, step, style, summary, tabindex, target, title, translate, type, usemap, value, width, wrap, list, min, max, step, accept, alt, height, width, autoplay, loop, muted, preload, poster, disablepictureinpicture, disable-remote-playback, playsinline, controlslist, seamless, frameborder, marginheight, marginwidth, scrolling, allowtransparency, classid, codebase, declare, typemustmatch, border, cellpadding, cellspacing, frame, rules, summary, align, valign, abbr, axis, char, charoff, bgcolor, compact, prompt, archive, code, object, hspace, vspace, face, background, text, link, vlink, alink, profile, xmlns, version, challenge, aria-activedescendant, aria-atomic, aria-autocomplete, aria-busy, aria-checked, aria-colcount, aria-colindex, aria-colspan, aria-controls, aria-current, aria-describedby, aria-description, aria-details, aria-disabled, aria-dropeffect, aria-errormessage, aria-expanded, aria-flowto, aria-grabbed, aria-haspopup, aria-hidden, aria-invalid, aria-keyshortcuts, aria-label, aria-labelledby, aria-live, aria-modal, aria-multiline, aria-multiselectable, aria-orientation, aria-owns, aria-placeholder, aria-posinset, aria-pressed, aria-readonly, aria-relevant, aria-required, aria-roledescription, aria-rowcount, aria-rowindex, aria-rowspan, aria-selected, aria-setsize, aria-sort, aria-valuemax, aria-valuemin, aria-valuenow, aria-valuetext, onafterprint, onbeforeprint, onbeforeunload, onblur, oncancel, oncanplay, oncanplaythrough, onchange, onclick, onclose, oncontextlost, oncontextmenu, oncontextrestored, oncopy, oncuechange, oncut, ondblclick, ondrag, ondragend, ondragenter, ondragleave, ondragover, ondragstart, ondrop, ondurationchange, onemptied, onended, onerror, onfocus, onformdata, oninput, oninvalid, onkeydown, onkeypress, onkeyup, onload, onloadeddata, onloadedmetadata, onloadstart, onlocate, onmousedown, onmouseenter, onmouseleave, onmousemove, onmouseout, onmouseover, onmouseup, onoffline, ononline, onpagehide, onpageshow, onpaste, onpause, onplay, onplaying, onprogress, onratechange, onreset, onresize, onscroll, onscrollend, onsecuritypolicyviolation, onseeked, onseeking, onselect, onslotchange, onstalled, onstorage, onsubmit, onsuspend, ontimeupdate, ontoggle, onunload, onvolumechange, onwaiting, onwheel

# The third list is available to a markup language that has a third class of attribute and HTML
# does not, so it is empty. The type colour is reached by the tag-name rule instead: an element
# name the language does not name is a type.
language.types =

# Dracula, which is what the other bundled plugins use, so a folder of mixed files is coloured with
# one scheme rather than six. It is Unluminous's per-token mapping rather than Dracula's HTML-specific
# one: theme.builtin is purple in every other manifest here, and an HTML file in the tab beside a
# TypeScript file should be read in the same scheme rather than a second one that almost agrees.
theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
