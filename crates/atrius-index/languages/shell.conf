# An Unluminous plugin. See the Rust one for what the format is.

plugin.id          = shell
plugin.name        = Shell Script
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax colouring, a file icon and the Dracula colour scheme for shell scripts. Comments, quoted strings, numbers, the control flow reserved words, and the shell's own builtin commands are told apart, and a function written the way POSIX shell writes one is found with no keyword in front of it.
plugin.limitations = A `$` prefixed variable is read as one ordinary word - `$HOME`, `$my_var` - because `$` is a word character in every language Unluminous reads, not something this manifest turns on, so it is swept into the same word as the name after it before any operator rule can see it on its own. It is coloured only when the whole token matches one of the named environment variables in `language.builtins` below; an arbitrary `$my_var` is plain text, exactly as an arbitrary identifier is in any other language here. `$(command)` and `$((expression))` colour the `$` itself as a function call, because a word directly followed by an opening bracket is read as one everywhere in Unluminous, and `$` on its own in front of `(` is such a word; this was not filed as a fault because it never produces a false definition; see the note by `brace_definitions` below for why. A string opened with a single quote is read with the same escaping rule one opened with a double quote is, though a real shell gives a single quoted string none at all - a backslash right before the closing quote of such a string, which is vanishingly rare, is read as escaping that quote rather than ending the string, because [`Grammar::escapes`] is one flag for both quote characters and there is no way from a manifest to say only one of them escapes. Heredocs (`<<EOF … EOF`) are not read as a distinct region and their body is coloured as ordinary shell text.

language.extensions    = .sh, .bash, .zsh
# See the Python plugin for why this is not written as a bare `#`: the settings parser reads a `#`
# that ends a manifest line as the start of a comment on that line, which would silently leave this
# key empty rather than holding the character shell actually comments with. The doubled hash below
# is a real trailing comment on this line; the value this key is set to is one character, `#`.
language.line_comment  = #
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = |&;<>=!(){}[]*?~%+-:,

# The shell's own reserved words - the ones the parser itself gives a special meaning, rather than
# any of the many programs a script happens to run. `[[` and `]]` are not listed: they are two
# characters each and this list holds single words, so they fall to the operator rule above like any
# other bracket.
language.keywords = if, then, elif, else, fi, for, while, until, do, done, case, esac, function, select, in, time, coproc

# The commands the shell interpreter implements itself, which is a different thing from a program a
# script happens to invoke such as `grep` or `git` - those are ordinary words to this plugin for the
# same reason a stylesheet does not colour a class name it did not provide. `return`, `break`,
# `continue` and `exit` are grammatically builtins rather than reserved words in POSIX shell, unlike
# Rust or JavaScript where the equivalent words are baked into the grammar, so they are listed here
# rather than above. A handful of the environment variables a script reads most often are included
# with their `$`, because that is the only way this tokeniser can colour one at all - see
# `plugin.limitations` for what that does and does not cover.
language.builtins = echo, cd, pwd, export, unset, read, printf, source, alias, unalias, exit, shift, trap, wait, eval, exec, set, local, declare, typeset, readonly, test, true, false, kill, jobs, bg, fg, umask, ulimit, return, break, continue, let, getopts, hash, type, command, builtin, mapfile, readarray, $HOME, $PATH, $USER, $PWD, $OLDPWD, $SHELL, $HOSTNAME, $UID, $RANDOM, $0

# `foo() { ... }` is how a shell function is written far more often than `function foo { ... }` is -
# no keyword, a parameter list that is always empty, and a brace straight after it - and that shape
# is exactly what `brace_definitions` was built for: a word directly before `()` on one line followed
# by `{`. `language.definers` stays empty on purpose. There is no reserved word in front of a POSIX
# function name to hang a definer off, and `function` is comparatively rare, its exact form varies
# between shells, and it is already caught by this same rule when it is written with parentheses -
# the one shape this misses is
# `function foo { ... }` with no parentheses at all, which is left unfound rather than guessed at.
language.brace_definitions = true

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
