# An Unluminous plugin. See the Rust one for what the format is.
#
# The awkward case named in the ticket: a YAML document is almost entirely bare, unquoted words, and
# the tokeniser has no way to tell a mapping key (`name`) from a plain scalar value (`Jason`) apart
# from position, which it does not read - it sees a run of letters either way. The decision made here
# is to leave a bare word to the same two rules every other bundled plugin already falls back to when
# a word matches nothing: the four fixed literals below are coloured because they are real reserved
# scalars, and everything else - a key and a value alike - is plain text, or a type if it happens to
# start with a capital letter, which is the same heuristic that reads `Promise` as a type in
# JavaScript and reads `Jason` the same way here. That is a real, visible quirk rather than a
# deliberate feature, and it is why this plugin does not try to guess further: colouring a key one
# way and a value another needs to know the indentation structure of the document, which this
# tokeniser does not read, and a wrong guess would be worse than a plain one.

plugin.id          = yaml
plugin.name        = YAML
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax colouring, a file icon and the Dracula colour scheme for YAML. Comments, quoted strings, numbers, and the boolean and null literals are told apart; a bare mapping key or scalar value is read as plain text.
plugin.limitations = A bare (unquoted) scalar is the ordinary way to write a YAML value and this plugin does not try to tell a mapping key from one, because the tokeniser reads a run of letters with no notion of indentation or of which side of a colon it is on - see the note above the keys for the reasoning. A quoted scalar that is folded across more than one line, and a block scalar introduced by `|` or `>`, are read the same way a triple quoted Python string is: the string rule ends at the first line break except for a backtick, so only the opening line of a folded quote is coloured as a string and a block scalar's body is read as ordinary text. YAML 1.1's other boolean spellings - `yes`, `no`, `on`, `off`, and their capitalised forms - are deliberately not listed: YAML 1.2's core schema dropped them, most tools this plugin is likely to meet write `true` and `false`, and adding eight more words for a form few files use was judged not worth the row.

language.extensions    = .yaml, .yml
# See the Python plugin for why this is not written as a bare `#`: the settings parser reads a `#`
# that ends a manifest line as the start of a comment on that line, which would silently leave this
# key empty rather than holding the character YAML actually comments with. The doubled hash below
# is a real trailing comment on this line; the value this key is set to is one character, `#`.
language.line_comment  = #
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = :-,[]{}|>&*!?%~

# The core schema's boolean and null literals, in the casings the specification allows -
# `true`/`True`/`TRUE`, and likewise for false and null. Matching is exact, so `Yes`-style aliases
# are not caught by any of these; see `plugin.limitations` for why they are left out rather than
# added. Null written as a single `~` is not a word at all, so it cannot appear in this list the way
# the others do - it is coloured as an operator instead, which is why `~` is in the line above.
language.builtins = true, True, TRUE, false, False, FALSE, null, Null, NULL

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
