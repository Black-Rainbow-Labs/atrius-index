# An Unluminous plugin. See the JavaScript one for what the format is.

plugin.id          = typescript
plugin.name        = TypeScript
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax colouring, a file icon and the Dracula colour scheme for TypeScript. Everything the JavaScript plugin knows, plus the words TypeScript adds: interface, type, enum, implements, readonly, the access modifiers, and the primitive type names.
plugin.limitations = A type is recognised by its capital letter rather than by being declared, so a lower case type alias is coloured as plain text. Decorators are coloured as an operator and then a name. JSX in a .tsx file is coloured as plain text. A class method is found as a definition only when its parameter list opens and closes on one line, so one whose parameters span lines is missed rather than half found.

language.extensions    = .ts, .tsx, .mts, .cts
language.line_comment  = //
language.block_comment = /*, */
language.strings       = ", ', `
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>!&|^~?:;,.@

language.keywords = const, let, var, function, class, interface, type, enum, namespace, module, declare, abstract, implements, extends, new, return, if, else, for, while, do, switch, case, default, break, continue, try, catch, finally, throw, typeof, instanceof, keyof, infer, is, asserts, satisfies, in, of, delete, void, async, await, yield, import, export, from, as, static, public, private, protected, readonly, override, get, set, this, super, null, undefined, true, false

# JavaScript's list plus the four words TypeScript has of its own. `brace_definitions` is on for the
# same reason: a class method has no keyword in front of its name.
language.definers        = function=function, class=type, const=variable, let=variable, var=variable, interface=type, enum=type, type=type, namespace=module
language.brace_definitions = true

# How an import is written, which is what `task-1680` completes. Every key here is off unless a
# language names it, so a plugin that says nothing about imports keeps exactly the behaviour it had.
# `quoted` means the module is a string resolved against the file system; the extensions are tried in
# the order they are listed, and `import_omit_extension` is why what is inserted is `./layout` rather
# than `./layout.ts`. `export_keyword` is what makes a definition importable, so a `const` inside a
# function body is a definition and is not offered to another file.
language.imports               = quoted
language.import_keywords       = import, export, require
language.import_extensions     = .ts, .tsx, .mts, .cts, .js, .jsx, .mjs, .cjs
language.import_index          = index
language.import_omit_extension = true
language.export_keyword        = export

# The same two keys the JavaScript plugin carries, with TypeScript's own way of running one file:
# `npx tsx` is the runner that needs nothing installed in the project.
run.file    = npx tsx {file}
run.project = npm

# Which debugger a file of this language is debugged with: Microsoft's js-debug, which is the actual
# debugger inside VS Code for Node and which publishes a standalone DAP server. Data, like the two
# keys above - the name is checked against the list built into Unluminous and nothing here is executed.
debug.adapter = node

language.builtins = console, window, document, globalThis, process, require, Promise, Array, Object, String, Number, Boolean, Symbol, BigInt, Math, JSON, Date, RegExp, Map, Set, WeakMap, WeakSet, Error, Record, Partial, Required, Readonly, Pick, Omit, Exclude, Extract, Awaited, ReturnType, string, number, boolean, any, unknown, never, object, bigint, symbol, setTimeout, fetch

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
