# An atrius-index language manifest, in the format `docs/languages.md` describes.

plugin.id          = c
plugin.name        = C
plugin.kind        = language
plugin.limitations = A function is found when its parameter list opens and closes on one line, followed by its opening brace on that line or the next. A macro is not a definition. A function like macro used before a brace reads as a likely definition.

language.extensions    = .c, .h
language.line_comment  = //
language.block_comment = /*, */
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>!&|^~?:;,.

language.keywords = auto, break, case, char, const, continue, default, do, double, else, enum, extern, float, for, goto, if, inline, int, long, register, restrict, return, short, signed, sizeof, static, struct, switch, typedef, union, unsigned, void, volatile, while, _Bool, _Atomic, _Static_assert, _Alignof, _Alignas, _Generic, _Noreturn, _Thread_local, defined
language.builtins = NULL, size_t, ssize_t, uint8_t, uint16_t, uint32_t, uint64_t, int8_t, int16_t, int32_t, int64_t, bool, true, false, printf, malloc, free, memcpy, memset, strlen

language.definers          = struct=type, enum=type, union=type
language.brace_definitions = true
language.brace_next_line   = true
language.definition_tail   = true
