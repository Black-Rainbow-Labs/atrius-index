# An atrius-index language manifest, in the format `docs/languages.md` describes.

plugin.id          = java
plugin.name        = Java
plugin.kind        = language
plugin.limitations = A method is found when its parameter list opens and closes on one line, followed by its opening brace on that line or the next, with a throws clause allowed between. A field is not a definition.

language.extensions    = .java
language.line_comment  = //
language.block_comment = /*, */
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>!&|^~?:;,.@

language.keywords = abstract, assert, boolean, break, byte, case, catch, char, class, const, continue, default, do, double, else, enum, extends, final, finally, float, for, goto, if, implements, import, instanceof, int, interface, long, native, new, package, private, protected, public, return, short, static, strictfp, super, switch, synchronized, this, throw, throws, transient, try, void, volatile, while, var, record, yield, sealed, permits, true, false, null
language.builtins = String, Object, Integer, Long, Double, Boolean, List, Map, Set, ArrayList, HashMap, Optional, System, Exception, RuntimeException, Override

language.definers          = class=type, interface=type, enum=type, record=type
language.brace_definitions = true
language.brace_next_line   = true
language.definition_tail   = true

# The structural reading (Unluminous task-2231): which blocks hold members and of what kind, how a
# type is written beside a name and after a parameter list, who may use a definition, and what reaches
# a member. Completion reads these to offer the members of a type, show what a function takes and
# returns, and know what a field or a variable holds. Every key is optional.
language.containers = class, interface, enum, record
language.records    = class, record
language.enums      = enum
language.kinds      = class=class, interface=interface, enum=enum, record=class
language.visibility = public=public, protected=crate, private
language.members    = .
